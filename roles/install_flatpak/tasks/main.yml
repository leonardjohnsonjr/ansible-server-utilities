---
- name: Install or update Flatpak for host OS family
  ansible.builtin.include_tasks: "{{ install_flatpak_task_file }}"
  vars:
    install_flatpak_task_file: >-
      {{ 'debian.yml' if ansible_os_family == 'Debian'
         else 'redhat.yml' if ansible_os_family == 'RedHat' }}
  when: ansible_os_family in ['Debian', 'RedHat']
